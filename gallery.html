<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Photo Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stats {
            color: #aaa;
            font-size: 1.1em;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tab {
            padding: 12px 30px;
            background: #333;
            border: none;
            color: #fff;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .tab:hover {
            background: #444;
        }

        .tab.active {
            background: #0066cc;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .controls label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1em;
        }

        .controls select {
            padding: 8px 15px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
            background: #2a2a2a;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
            opacity: 0;
        }

        .gallery-item img.loaded {
            opacity: 1;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 3px solid #555;
            border-top-color: #0066cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
        }

        .pagination button {
            padding: 10px 20px;
            background: #333;
            border: none;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: #0066cc;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination span {
            font-size: 1em;
            color: #aaa;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .video-item {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-item video {
            width: 100%;
            display: block;
        }

        .video-item .video-name {
            padding: 10px;
            font-size: 0.9em;
            color: #aaa;
        }

        /* Lightbox Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 3em;
            padding: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .modal-nav:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-nav.prev {
            left: 20px;
        }

        .modal-nav.next {
            right: 20px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 40px;
            font-size: 3em;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-counter {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2em;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #aaa;
        }
    </style>
</head>
<body>
    <header>
        <h1>Wedding Photo Gallery</h1>
        <div class="stats">
            <span id="photoCount">Loading...</span> Photos •
            <span id="videoCount">Loading...</span> Videos
        </div>
        <button id="logoutBtn" style="position: absolute; top: 20px; right: 20px; padding: 8px 16px; background: #555; border: none; color: white; border-radius: 5px; cursor: pointer; font-size: 0.9em;">Logout</button>
    </header>

    <div class="tabs">
        <button class="tab active" onclick="showSection('photos')">Photos</button>
        <button class="tab" onclick="showSection('videos')">Videos</button>
    </div>

    <div id="photos" class="section active">
        <div class="controls">
            <label>
                Photos per page:
                <select id="photosPerPage" onchange="changePhotosPerPage()">
                    <option value="20">20</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                    <option value="all">All</option>
                </select>
            </label>
        </div>
        <div class="loading">Loading photos...</div>
        <div class="gallery" id="photoGallery"></div>
        <div class="pagination" id="photoPagination" style="display: none;">
            <button onclick="changePage(-1)">Previous</button>
            <span id="pageInfo"></span>
            <button onclick="changePage(1)">Next</button>
        </div>
    </div>

    <div id="videos" class="section">
        <div class="loading">Loading videos...</div>
        <div class="video-grid" id="videoGallery"></div>
    </div>

    <!-- Lightbox Modal -->
    <div id="modal" class="modal">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal-counter" id="modalCounter"></div>
        <button class="modal-nav prev" onclick="navigateModal(-1)">‹</button>
        <img id="modalImage" class="modal-content" alt="">
        <button class="modal-nav next" onclick="navigateModal(1)">›</button>
    </div>

    <script>
        // Check authentication
        if (sessionStorage.getItem('gallery_authenticated') !== 'true') {
            window.location.href = '/login.html';
        }

        let photos = [];
        let currentPhotoIndex = 0;
        let currentPage = 0;
        let photosPerPage = 50;
        let loadedImages = new Set();

        // Tab switching
        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

            document.getElementById(section).classList.add('active');
            event.target.classList.add('active');
        }

        // Intersection Observer for lazy loading
        const imageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    const src = img.dataset.src;
                    if (src && !loadedImages.has(src)) {
                        loadImage(img, src);
                        observer.unobserve(img);
                    }
                }
            });
        }, {
            rootMargin: '50px'
        });

        // Load image with error handling
        function loadImage(img, src) {
            const item = img.parentElement;
            item.classList.add('loading');

            const tempImg = new Image();
            tempImg.onload = () => {
                img.src = src;
                img.classList.add('loaded');
                item.classList.remove('loading');
                loadedImages.add(src);
            };
            tempImg.onerror = () => {
                console.error('Failed to load:', src);
                item.classList.remove('loading');
                img.alt = 'Failed to load';
            };
            tempImg.src = src;
        }

        // Load photos
        async function loadPhotos() {
            try {
                // Try to load from all_photos_web first (converted images)
                let photoDir = 'all_photos_web/';
                let response = await fetch(photoDir);

                // If all_photos_web doesn't exist, fall back to all_photos
                if (!response.ok) {
                    photoDir = 'all_photos/';
                    response = await fetch(photoDir);
                }

                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const links = Array.from(doc.querySelectorAll('a'))
                    .map(a => a.getAttribute('href'))
                    .filter(href => href && /\.(heic|png|jpg|jpeg)$/i.test(href));

                photos = links.map(href => {
                    // Convert HEIC to JPG path if using web directory
                    if (photoDir === 'all_photos_web/' && href.toLowerCase().endsWith('.heic')) {
                        return photoDir + href.replace(/\.heic$/i, '.jpg');
                    }
                    return photoDir + href;
                });

                document.getElementById('photoCount').textContent = photos.length;

                // Show message if using unconverted HEIC files
                if (photoDir === 'all_photos/') {
                    const loadingDiv = document.querySelector('#photos .loading');
                    loadingDiv.innerHTML = '<strong>⚠️ Note:</strong> HEIC files may not display in all browsers. Run <code>./convert_heic.sh</code> to convert them to JPEG.<br><br>';
                    loadingDiv.style.color = '#ff9800';
                    loadingDiv.style.fontSize = '0.9em';
                    setTimeout(() => {
                        loadingDiv.style.display = 'none';
                    }, 5000);
                } else {
                    document.querySelector('#photos .loading').style.display = 'none';
                }

                renderPhotos();
            } catch (error) {
                console.error('Error loading photos:', error);
                document.querySelector('#photos .loading').textContent = 'Error loading photos. Please make sure you opened this file using a local web server.';
            }
        }

        // Render photos for current page
        function renderPhotos() {
            const gallery = document.getElementById('photoGallery');
            gallery.innerHTML = '';

            let startIndex, endIndex;
            if (photosPerPage === 'all') {
                startIndex = 0;
                endIndex = photos.length;
                document.getElementById('photoPagination').style.display = 'none';
            } else {
                startIndex = currentPage * photosPerPage;
                endIndex = Math.min(startIndex + photosPerPage, photos.length);
                updatePagination();
            }

            const photosToShow = photos.slice(startIndex, endIndex);

            photosToShow.forEach((photo, index) => {
                const absoluteIndex = startIndex + index;
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openModal(absoluteIndex);

                const img = document.createElement('img');
                img.dataset.src = photo;
                img.alt = photo.split('/').pop();

                item.appendChild(img);
                gallery.appendChild(item);

                // Observe for lazy loading
                imageObserver.observe(img);
            });

            // Scroll to top when changing pages
            if (currentPage > 0) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Pagination controls
        function updatePagination() {
            const totalPages = Math.ceil(photos.length / photosPerPage);
            const pagination = document.getElementById('photoPagination');
            const pageInfo = document.getElementById('pageInfo');
            const buttons = pagination.querySelectorAll('button');

            pagination.style.display = 'flex';
            pageInfo.textContent = `Page ${currentPage + 1} of ${totalPages}`;

            buttons[0].disabled = currentPage === 0;
            buttons[1].disabled = currentPage >= totalPages - 1;
        }

        function changePage(delta) {
            const totalPages = Math.ceil(photos.length / photosPerPage);
            const newPage = currentPage + delta;

            if (newPage >= 0 && newPage < totalPages) {
                currentPage = newPage;
                renderPhotos();
            }
        }

        function changePhotosPerPage() {
            const select = document.getElementById('photosPerPage');
            const value = select.value;
            photosPerPage = value === 'all' ? 'all' : parseInt(value);
            currentPage = 0;
            loadedImages.clear(); // Clear cache when changing view
            renderPhotos();
        }

        // Load videos
        async function loadVideos() {
            try {
                const response = await fetch('all_videos/');
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const links = Array.from(doc.querySelectorAll('a'))
                    .map(a => a.getAttribute('href'))
                    .filter(href => href && /\.mov$/i.test(href));

                const videos = links.map(href => 'all_videos/' + href);

                document.getElementById('videoCount').textContent = videos.length;

                const gallery = document.getElementById('videoGallery');
                gallery.innerHTML = '';

                videos.forEach(video => {
                    const item = document.createElement('div');
                    item.className = 'video-item';

                    const videoEl = document.createElement('video');
                    videoEl.src = video;
                    videoEl.controls = true;
                    videoEl.preload = 'none'; // Changed from 'metadata' to 'none' for better performance

                    const name = document.createElement('div');
                    name.className = 'video-name';
                    name.textContent = video.split('/').pop();

                    item.appendChild(videoEl);
                    item.appendChild(name);
                    gallery.appendChild(item);
                });

                document.querySelector('#videos .loading').style.display = 'none';
            } catch (error) {
                console.error('Error loading videos:', error);
                document.querySelector('#videos .loading').textContent = 'Error loading videos. Please make sure you opened this file using a local web server.';
            }
        }

        // Modal functions
        function openModal(index) {
            currentPhotoIndex = index;
            updateModal();
            document.getElementById('modal').classList.add('active');
            // Preload next and previous images
            preloadModalImages();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function navigateModal(direction) {
            currentPhotoIndex = (currentPhotoIndex + direction + photos.length) % photos.length;
            updateModal();
            preloadModalImages();
        }

        function updateModal() {
            const img = document.getElementById('modalImage');
            const counter = document.getElementById('modalCounter');

            img.src = photos[currentPhotoIndex];
            counter.textContent = `${currentPhotoIndex + 1} / ${photos.length}`;
        }

        function preloadModalImages() {
            // Preload next image
            const nextIndex = (currentPhotoIndex + 1) % photos.length;
            const nextImg = new Image();
            nextImg.src = photos[nextIndex];

            // Preload previous image
            const prevIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
            const prevImg = new Image();
            prevImg.src = photos[prevIndex];
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('modal');
            if (modal.classList.contains('active')) {
                if (e.key === 'ArrowLeft') navigateModal(-1);
                if (e.key === 'ArrowRight') navigateModal(1);
                if (e.key === 'Escape') closeModal();
            }
        });

        // Close modal on background click
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('gallery_authenticated');
            window.location.href = '/login.html';
        });

        // Load content on page load
        loadPhotos();
        loadVideos();
    </script>
</body>
</html>
